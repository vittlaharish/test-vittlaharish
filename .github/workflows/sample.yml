name: sample

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Dev"
        required: true
        default: "dev"
  push:
    branches: [ main ]

env:
  VSTS_TOKEN: ${{ secrets.VSTS_TOKEN }}

jobs:
  Compile:
    # if: github.event.pull_request.merged == true
    runs-on: DevServer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3.1.0

      - uses: nuget/setup-nuget@v1
      - run: nuget restore $env:Repository_Name

  Build:
    runs-on: DevServer
    name: Build
    needs: Compile
    steps:
      - name: Build
        run: |
          Write-Host "Building on Windows..."

  UploadArtificats:
    # Only run this if a pull request was closed and it merged successfully
    # if: github.event.pull_request.merged == true
    runs-on: DevServer
    name: artifact
    needs: Build
    steps:
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output

  DeployDev03V:
    runs-on: DevServer
    environment:
      name: Deploy to Dev
    needs: UploadArtificats
    steps:
      - name: Create ServiceNow Change Request
        id: snow_change
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
            devops-integration-token: ${{ secrets.SNOW_TOKEN }}
            instance-url: ${{ secrets.SNOW_INSTANCE_URL }}
            tool-id: ${{ secrets.SN_TOOL_ID }}
            context-github: ${{ toJSON(github) }}
            job-name: 'ServiceNow DevOps Change'
            change-request: 
                '{"attributes":{"u_source_refid": "TESTAPI_mmddyyhhmm","u_source": "TEST API","u_affected_ci": "ServiceNow Development","u_assignment_group": "ServiceNow implementation Team","u_type": "normal","u_category": "Applications Software","requested_by": {"name": "Devika Shukla"},"u_requested_by_email": "Devika.Shukla@travelport.com","u_requested_by_id": "739912","u_environment": "pp","u_short_description": "Automated Software Deployment",                "u_description": "Automated Software Deployment","u_justification": "Automated Software Deployment Test with Service NOw DevOps","u_implementation_plan": "Software update is tested and results can be found in Test Summaries Tab; When the change is approved the implementation happens automated by the CICD pipeline within the change planned start and end time window","u_test_plan": "Testing if the software was successfully deployed","u_backout_plan": "When software fails in production, the previous software release will be re-deployed","u_scheduled_start_date": "2025-01-13 06:00:00","u_scheduled_end_date": "2025-01-13 06:30:00","u_customer_facing": "no","u_delta_created": "","u_impact": "1","u_priority": "2","u_resiliency_testing": "","u_risk": "2","u_complex_change": "no","u_impact_duration": "yes","u_system_app_network_down": "yes","u_planned_impact": "yes","u_fallback_duration": "10 Min","u_mandate_governance_pci": "yes"}}'
            interval: '100'
            timeout: '3600'
            changeCreationTimeOut: '3600'
            abortOnChangeCreationFailure: true
            abortOnChangeStepTimeout: true
      - name: Output of Change Creation
        run: echo "change-request-number = ${{ steps.create.outputs.change-request-number }}" >> $GITHUB_OUTPUT

      - name: Backup Previous Version
        run: |
          $envName = "${{ github.event.inputs.target_environment }}"
          Write-Host "Backup Previous Version: $envName"
          Copy-Item -Path "D:\Inetpub\wwwroot\ServiceNowDevops_Demo\*" `
                    -Destination "D:\Trailing\ServiceNowDevops_Demo" `
                    -Recurse -Force

